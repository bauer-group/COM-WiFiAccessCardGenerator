# =============================================================================
# Dependabot Configuration
# =============================================================================
# Monitors dependencies for security updates and version bumps.
#
# Ecosystems:
#   - npm: Node.js packages (package.json)
#   - github-actions: CI/CD workflow actions
# =============================================================================

version: 2
updates:
  # ---------------------------------------------------------------------------
  # npm (Node.js) dependencies
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "npm"
      - "dependabot"
    commit-message:
      prefix: "chore(deps)"
    # Group minor/patch updates to reduce PR noise.
    # Lock-step groups come first: Dependabot assigns a dependency to the
    # first group it matches, and these must also move together on majors.
    groups:
      # react-dom throws "Incompatible React versions" at load time unless
      # react and react-dom have the exact same version.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # react-i18next majors carry a hard peer floor on i18next
      # (17.x requires i18next >= 26.2.0).
      i18next:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"
    # Limit open PRs to avoid overwhelming
    open-pull-requests-limit: 25
    # Auto-merge patch updates (requires GitHub Actions workflow)
    versioning-strategy: increase

  # ---------------------------------------------------------------------------
  # GitHub Actions updates
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"
