# =============================================================================
# Dependabot Configuration
# =============================================================================
# Monitors dependencies for security updates and version bumps.
#
# Ecosystems:
#   - npm: Node.js packages (package.json)
#   - github-actions: CI/CD workflow actions
# =============================================================================

version: 2
updates:
  # ---------------------------------------------------------------------------
  # npm (Node.js) dependencies
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "npm"
      - "dependabot"
    commit-message:
      prefix: "chore(deps)"
    # Groups split by update type, so they never overlap:
    # - npm-minor-and-patch: every minor and patch update in one PR per
    #   run, merged by dependabot-maintenance.yml once ci.yml passed.
    #   0.x packages are excluded and keep their own PRs: a 0.y minor
    #   counts as major for the auto-merge gate and would hold the whole
    #   group open.
    # - react, i18next (update-types major):
    #   majors of these packages stay in one PR per group, open for review.
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "class-variance-authority"
          - "sharp"
        update-types:
          - "minor"
          - "patch"
      # react-dom throws "Incompatible React versions" at load time unless
      # react and react-dom have the exact same version.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"
      # react-i18next majors carry a hard peer floor on i18next
      # (17.x requires i18next >= 26.2.0).
      i18next:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
        update-types:
          - "major"
    # Limit open PRs to avoid overwhelming
    open-pull-requests-limit: 25
    # Auto-merge patch updates (requires GitHub Actions workflow)
    versioning-strategy: increase

  # ---------------------------------------------------------------------------
  # GitHub Actions updates
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"
