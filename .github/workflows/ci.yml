# =============================================================================
# Pull Request Verification
# =============================================================================
# Runs the same install/type-check/build steps as the GitHub Pages deploy
# job, so dependency updates (Dependabot or manual) are verified before
# they reach main.
# =============================================================================

name: ✅ CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: 🔨 Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test:run -- --passWithNoTests

      - name: Build
        run: npm run build
